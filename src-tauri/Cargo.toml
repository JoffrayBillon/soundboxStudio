[package]
name = "soundbox-studio"
version = "0.1.0"
description = "A lightweight cross-platform soundboard application"
authors = ["Soundbox Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "soundbox_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "soundbox-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = [] }
tauri-plugin-dialog       = "2"
tauri-plugin-fs           = "2"
tauri-plugin-notification = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

midir  = "0.10"
cpal   = "0.15"
rodio  = { version = "0.19", default-features = false, features = ["wav", "mp3", "vorbis", "flac"] }

uuid        = { version = "1", features = ["v4"] }
dirs        = "5"
thiserror   = "1"
parking_lot = "0.12"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default         = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level   = 1
incremental = true

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
